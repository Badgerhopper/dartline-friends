name: DartLine build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile full app and run all unit tests
        run: docker build --build-arg RUN_TESTS=1 --progress=plain -t dartline-verified .
      - name: Smoke-test production server startup and HTTP health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dartline-ci-smoke -e PORT=10000 \
            -p 127.0.0.1:13455:10000 dartline-verified
          trap 'docker logs dartline-ci-smoke; docker rm -f dartline-ci-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 35); do
            if curl --fail --silent --max-time 3 -o /dev/null http://127.0.0.1:13455/; then
              echo "DartLine production container started and served HTTP"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' dartline-ci-smoke)" != "true" ]; then
              echo "Production container stopped during startup"
              exit 1
            fi
            sleep 2
          done
          echo "Production container failed HTTP health check"
          exit 1
      - name: Check which version is actually live on Render (informational)
        continue-on-error: true
        shell: bash
        run: |
          marker="$(curl -fLsS --retry 2 --retry-delay 5 --max-time 75 \
            'https://dartline-friends.onrender.com/dartline-build.txt' 2>/dev/null || true)"
          echo "LIVE_RENDER_MARKER=${marker:-unreachable}"
          if [ "$marker" != 'dartline-v4.3-reliable-repeat-visits-2026-11-26' ]; then
            echo "::warning::Render is not confirmed to be serving the new checkout and mobile-screen release."
            exit 1
          fi
          echo "Confirmed: Render serves the updated phone scoreboard and checkout build."
